name: self-check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  golden-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Golden tests
        run: bash scripts/self_check.sh
