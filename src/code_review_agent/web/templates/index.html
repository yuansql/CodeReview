<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>代码审核数字员工</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f6f1ea;
      --ink: #1c1917;
      --muted: #78716c;
      --card: #fffdf9;
      --accent: #9f1239;
      --line: #e7e0d5;
      --soft: #faf6f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif;
      background:
        radial-gradient(circle at 10% 0%, #fde68a55, transparent 40%),
        radial-gradient(circle at 90% 10%, #fda4af33, transparent 35%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.85rem;
      letter-spacing: 0.02em;
      margin: 0 0 0.35rem;
    }
    .sub { color: var(--muted); margin-bottom: 1.75rem; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1.25rem;
    }
    label { display: block; font-size: 0.92rem; margin: 0.75rem 0 0.35rem; color: #44403c; }
    select, input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font: inherit;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #a8a29e 50%),
        linear-gradient(135deg, #a8a29e 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 2rem;
    }
    select:disabled {
      background-color: var(--soft);
      color: #a8a29e;
      cursor: not-allowed;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 0.85rem; }
    @media (max-width: 720px) {
      .row, .row-3 { grid-template-columns: 1fr; }
    }
    button {
      margin-top: 1.1rem;
      border: 0;
      background: var(--accent);
      color: #fff;
      padding: 0.75rem 1.2rem;
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .meta { font-size: 0.9rem; color: var(--muted); margin-top: 0.75rem; white-space: pre-wrap; }
    .report {
      margin-top: 1rem;
      padding: 1rem 1.1rem;
      border-top: 1px dashed var(--line);
      line-height: 1.55;
    }
    .report pre { overflow: auto; font-size: 0.85rem; line-height: 1.45; }
    .report pre code { white-space: pre; }
    .std { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
    .panel-title {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
    }
    .panel-hint {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .cascade {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.85rem 1rem 1.1rem;
    }
    .cascade label { margin-top: 0.35rem; font-size: 0.86rem; }
    .cascade .crumb {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.75rem;
      min-height: 1.2em;
    }
    .sev-fatal { color: #991b1b; font-weight: 700; } /* 深红：影响运行 */
    .sev-warn { color: #ca8a04; font-weight: 700; }  /* 黄：一般警告 */
    .sev-slow { color: #fb7185; font-weight: 700; }  /* 淡红：SLOW_SQL */
    .report h2 .sev-fatal, .report h3 .sev-fatal { color: #991b1b; }
    .report h2 .sev-warn, .report h3 .sev-warn { color: #ca8a04; }
    .report h2 .sev-slow, .report h3 .sev-slow { color: #fb7185; }
    .report .sev-fatal { color: #991b1b; }
    .report .sev-warn { color: #d97706; }
    .report .sev-slow { color: #fb7185; }
  </style>
</head>
<body>
  <main>
    <h1>代码审核数字员工</h1>
    <p class="sub">选项目 → 选待合并分支与合并目标 → 生成报告。规范按 projects.yaml 绑定，不会串项目。</p>

    <section class="panel">
      <div>
        <label for="project">项目</label>
        <select id="project"></select>
        <div class="std" id="stdInfo"></div>
      </div>
      <div class="row" style="margin-top:0.35rem">
        <div>
          <label for="mergeBranch">合并分支（目标 / 主分支）</label>
          <select id="mergeBranch">
            <option value="">请选择合并分支</option>
          </select>
        </div>
        <div>
          <label for="branch">分支（待合并）</label>
          <select id="branch">
            <option value="">请选择分支</option>
          </select>
        </div>
      </div>
      <p class="std" style="margin-top:0.85rem">
        审核范围：<strong>合并分支 → 待合并分支</strong> 整段差距代码。
        命名 / 慢SQL / 慢代码只看<strong>新增行</strong>；语法与括号查整文件。
        <span class="sev-fatal">致命深红（影响运行）</span> /
        <span class="sev-slow">SLOW_SQL 淡红</span> /
        <span class="sev-warn">警告黄</span>。
        命名仅报类/方法明显违规；说得过去的不黄警告。
      </p>
      <button id="runBtn" type="button">生成报告</button>
      <div class="meta" id="status"></div>
      <div class="report" id="reportView"></div>
    </section>

    <section class="panel">
      <h2 class="panel-title">最近报告</h2>
      <p class="panel-hint">三级联动：项目 → 日期 → 报告文件</p>
      <div class="cascade">
        <div class="row-3">
          <div>
            <label for="histProject">① 项目</label>
            <select id="histProject"></select>
          </div>
          <div>
            <label for="histDay">② 日期</label>
            <select id="histDay" disabled></select>
          </div>
          <div>
            <label for="histReport">③ 报告</label>
            <select id="histReport" disabled></select>
          </div>
        </div>
        <div class="crumb" id="histCrumb">请先选择项目</div>
      </div>
    </section>
  </main>

  <script>
    const projects = {{ projects | tojson }};
    let reportItems = [];
    let reportTree = {};

    const projectEl = document.getElementById('project');
    const branchEl = document.getElementById('branch');
    const mergeBranchEl = document.getElementById('mergeBranch');
    const statusEl = document.getElementById('status');
    const reportView = document.getElementById('reportView');
    const stdInfo = document.getElementById('stdInfo');
    const histProject = document.getElementById('histProject');
    const histDay = document.getElementById('histDay');
    const histReport = document.getElementById('histReport');
    const histCrumb = document.getElementById('histCrumb');

    projects.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.display_name} (${p.id})`;
      projectEl.appendChild(opt);
    });

    function fillSelect(el, options, placeholder, enabled = true) {
      el.innerHTML = '';
      const first = document.createElement('option');
      first.value = '';
      first.textContent = placeholder;
      el.appendChild(first);
      options.forEach(([value, label]) => {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        el.appendChild(opt);
      });
      el.disabled = !enabled || options.length === 0;
    }

    function buildReportTree(items) {
      const tree = {};
      items.forEach(item => {
        const pid = item.project_id || 'unknown';
        const day = item.day || 'unknown';
        if (!tree[pid]) tree[pid] = {};
        if (!tree[pid][day]) tree[pid][day] = [];
        tree[pid][day].push(item);
      });
      Object.values(tree).forEach(days => {
        Object.values(days).forEach(list => {
          list.sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
        });
      });
      return tree;
    }

    function updateCrumb() {
      const p = histProject.value;
      const d = histDay.value;
      const r = histReport.value;
      if (!p) {
        histCrumb.textContent = '请先选择项目';
        return;
      }
      if (!d) {
        histCrumb.textContent = `已选：${p} → 请选择日期`;
        return;
      }
      if (!r) {
        histCrumb.textContent = `已选：${p} → ${d} → 请选择报告`;
        return;
      }
      const item = (reportTree[p]?.[d] || []).find(x => x.rel === r);
      histCrumb.textContent = `当前：${p} → ${d} → ${item ? item.name : r}`;
    }

    function renderHistProjects(selectedProject = '') {
      const pids = Object.keys(reportTree).sort();
      fillSelect(
        histProject,
        pids.map(id => [id, id]),
        pids.length ? '请选择项目' : '暂无报告',
        pids.length > 0
      );
      if (selectedProject && reportTree[selectedProject]) {
        histProject.value = selectedProject;
      }
      renderHistDays();
    }

    function renderHistDays(selectedDay = '') {
      const pid = histProject.value;
      const days = pid ? Object.keys(reportTree[pid] || {}).sort().reverse() : [];
      fillSelect(
        histDay,
        days.map(d => [d, d]),
        days.length ? '请选择日期' : (pid ? '该项目暂无日期' : '先选项目'),
        Boolean(pid) && days.length > 0
      );
      if (selectedDay && days.includes(selectedDay)) {
        histDay.value = selectedDay;
      }
      renderHistReports();
    }

    function renderHistReports(selectedRel = '') {
      const pid = histProject.value;
      const day = histDay.value;
      const list = (pid && day && reportTree[pid]?.[day]) || [];
      fillSelect(
        histReport,
        list.map(item => [item.rel, item.name]),
        list.length ? '请选择报告' : (day ? '该日期暂无报告' : '先选日期'),
        Boolean(day) && list.length > 0
      );
      if (selectedRel && list.some(x => x.rel === selectedRel)) {
        histReport.value = selectedRel;
      }
      updateCrumb();
    }

    async function loadBranches() {
      const id = projectEl.value;
      const p = projects.find(x => x.id === id);
      stdInfo.textContent = p
        ? `仓库: ${p.repo}\nPHP规范: ${((p.standards||{}).php||[]).join(' | ') || '（无→跳过命名）'}\nPython规范: ${((p.standards||{}).python||[]).join(' | ') || '（无→跳过命名）'}\n方法风格: ${p.php_method_style}`
        : '';
      statusEl.textContent = '正在拉取远程分支列表…';
      const res = await fetch(`/api/projects/${encodeURIComponent(id)}/branches`);
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = `分支列表失败: ${data.detail || res.status}`;
        return;
      }

      const options = (data.branches || []).map(b => {
        const name = typeof b === 'string' ? b : b.name;
        const source = typeof b === 'string' ? '' : (b.source || '');
        let tag = '';
        if (source === 'local_and_remote') tag = '（本地+云）';
        else if (source === 'remote_only') tag = '（仅云端）';
        else if (source === 'local_only') tag = '（仅本地）';
        return [name, name + tag];
      });

      // 不默认选中任何分支，需手动选择
      fillSelect(branchEl, options, options.length ? '请选择待合并分支' : '暂无分支', options.length > 0);
      fillSelect(mergeBranchEl, options, options.length ? '请选择合并目标分支' : '暂无分支', options.length > 0);

      statusEl.textContent = data.fetch_warning
        ? `远程 fetch 有警告（仍显示已缓存远程分支）: ${data.fetch_warning}`
        : '分支列表已更新。请选择「待合并分支」与「合并分支」，将审核两者差距。';
    }

    async function loadReportList(selectedRel = '') {
      const res = await fetch('/api/reports?limit=100');
      reportItems = await res.json();
      reportTree = buildReportTree(reportItems);

      let selectedProject = '';
      let selectedDay = '';
      if (selectedRel) {
        const hit = reportItems.find(x => x.rel === selectedRel);
        if (hit) {
          selectedProject = hit.project_id;
          selectedDay = hit.day;
        }
      }

      renderHistProjects(selectedProject);
      if (selectedProject) renderHistDays(selectedDay);
      if (selectedRel) renderHistReports(selectedRel);
      if (selectedRel) await showReport(selectedRel);
    }

    async function showReport(rel) {
      const res = await fetch(`/api/reports/content?rel=${encodeURIComponent(rel)}`);
      const data = await res.json();
      marked.setOptions({ breaks: true });
      reportView.innerHTML = marked.parse(data.content || '');
      statusEl.textContent = `正在查看: ${rel}`;
    }

    document.getElementById('runBtn').addEventListener('click', async () => {
      const btn = document.getElementById('runBtn');
      const branch = branchEl.value;
      const mergeBranch = mergeBranchEl.value;
      if (!branch || !mergeBranch) {
        statusEl.textContent = '请先选择「分支（待合并）」和「合并分支（目标）」';
        return;
      }
      if (branch === mergeBranch) {
        statusEl.textContent = '两个分支不能相同，请重新选择';
        return;
      }
      btn.disabled = true;
      statusEl.textContent = `审核中：${mergeBranch} ← ${branch} 的差距代码…`;
      reportView.innerHTML = '';
      try {
        const body = {
          project_id: projectEl.value,
          branch,
          merge_branch: mergeBranch,
        };
        const res = await fetch('/api/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '请求失败');
        const s = data.summary || {};
        statusEl.textContent =
          `完成：致命 ${s.fatal ?? 0} / 警告 ${s.warning ?? 0}\n` +
          `对比：${data.resolved_base || mergeBranch} ... ${data.resolved_head || branch}\n` +
          `报告: ${data.report_rel || data.report_path}`;
        await loadReportList(data.report_rel || '');
      } catch (e) {
        statusEl.textContent = `失败: ${e.message || e}`;
      } finally {
        btn.disabled = false;
      }
    });

    projectEl.addEventListener('change', loadBranches);
    histProject.addEventListener('change', () => {
      renderHistDays();
      updateCrumb();
    });
    histDay.addEventListener('change', () => {
      renderHistReports();
      updateCrumb();
    });
    histReport.addEventListener('change', event => {
      updateCrumb();
      if (event.target.value) showReport(event.target.value);
    });

    loadBranches();
    loadReportList();
  </script>
</body>
</html>
