[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.2.0"
description = "数字员工：分支合并到 main 前的代码审核 Agent（PHP / Python）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "PyYAML>=6.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
code-review-agent = "code_review_agent.cli:app"
code-review-web = "code_review_agent.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_review_agent = ["web/templates/*.html"]
